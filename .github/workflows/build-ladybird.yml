name: Build Ladybird for Arch Linux

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag o rama de Ladybird a compilar (vacío = master)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 2G
  VCPKG_DEFAULT_BINARY_CACHE: /tmp/vcpkg-binary-cache

jobs:
  build:
    # El runner solo hospeda el contenedor; el entorno real de compilación es Arch.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git cmake ninja ccache nasm curl zip unzip tar zstd \
            pkgconf python rust autoconf-archive \
            qt6-base qt6-tools qt6-wayland qt6-positioning \
            libpulse libdrm glslang ttf-liberation

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ccache
            /tmp/vcpkg-binary-cache
          key: ladybird-arch-${{ github.run_id }}
          restore-keys: |
            ladybird-arch-

      # ladybird.py se niega a correr como root, así que creamos un usuario normal
      # y le damos propiedad del workspace y de las cachés.
      - name: Create non-root build user
        run: |
          useradd -m builder
          mkdir -p /tmp/ccache /tmp/vcpkg-binary-cache
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/ccache /tmp/vcpkg-binary-cache

      - name: Clone Ladybird
        shell: runuser -u builder -- env HOME=/home/builder bash -e {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/LadybirdBrowser/ladybird.git
          cd ladybird
          if [ -n "${{ inputs.ref }}" ]; then
            git checkout "${{ inputs.ref }}"
          fi
          echo "Compilando commit: $(git rev-parse HEAD)"

      - name: Fix GLFunctions build dependency
        working-directory: ladybird
        shell: runuser -u builder -- env HOME=/home/builder bash -e {0}
        run: |
          grep -q 'add_dependencies(LibCompositing generate_GLFunctions.cpp)' \
            Libraries/LibCompositing/CMakeLists.txt || \
          printf '\nadd_dependencies(LibCompositing generate_GLFunctions.cpp)\n' \
            >> Libraries/LibCompositing/CMakeLists.txt

      - name: Fix wasm linker error
        working-directory: ladybird
        shell: runuser -u builder -- env HOME=/home/builder bash -e {0}
        run: |
          grep -q 'target_link_options(wasm PRIVATE "LINKER:--no-as-needed")' \
            Utilities/CMakeLists.txt || \
          printf '\ntarget_link_options(wasm PRIVATE "LINKER:--no-as-needed")\n' \
            >> Utilities/CMakeLists.txt

      - name: Build Release
        working-directory: ladybird
        shell: runuser -u builder -- env HOME=/home/builder bash -e {0}
        run: |
          ./Meta/ladybird.py build --jobs "$(nproc)"
          ccache -s || true

      - name: Inspect build runtime dependencies
        working-directory: ladybird
        shell: runuser -u builder -- env HOME=/home/builder bash -e {0}
        run: |
          BIN="$(find Build -type f -name Ladybird -print -quit)"
          test -n "$BIN"
          echo "=== Binary: $BIN ==="
          echo "=== RPATH/RUNPATH ==="
          readelf -d "$BIN" | grep -E 'RPATH|RUNPATH' || echo "(ninguno)"
          echo "=== ldd ==="
          ldd "$BIN" || true
          echo "=== vcpkg lib dirs ==="
          find Build -type d -path '*vcpkg_installed*/lib' -print

      - name: Package Ladybird
        working-directory: ladybird
        shell: runuser -u builder -- env HOME=/home/builder bash -e {0}
        run: |
          set -euo pipefail

          STAGE="$GITHUB_WORKSPACE/stage"
          VCPKG_LIB="$(find Build -type d -path '*vcpkg_installed/x64-linux-dynamic/lib' -print -quit)"
          test -n "$VCPKG_LIB"

          mkdir -p "$STAGE"
          DESTDIR="$STAGE" ./Meta/ladybird.py install

          # Solo librerías compartidas de vcpkg (sin .a, pkgconfig, cmake, etc.)
          mkdir -p "$STAGE/usr/local/lib" "$STAGE/usr/local/bin"
          find "$VCPKG_LIB" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' \
            -exec cp -a {} "$STAGE/usr/local/lib/" \;

          # Launcher: ROOT = usr/local (donde están bin/ y lib/)
          cat > "$STAGE/usr/local/bin/ladybird-wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd -- "$(dirname -- "$(readlink -f -- "$0")")" && pwd)"
          ROOT="$(cd -- "$HERE/.." && pwd)"
          export LD_LIBRARY_PATH="$ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$ROOT/bin/Ladybird" "$@"
          EOF
          chmod +x "$STAGE/usr/local/bin/ladybird-wrapper"

          tar -czf "$GITHUB_WORKSPACE/ladybird-arch-x86_64.tar.gz" -C "$STAGE" .

      - name: Verify staged binary resolves all libraries
        run: |
          ROOT="$GITHUB_WORKSPACE/stage/usr/local"
          export LD_LIBRARY_PATH="$ROOT/lib"
          if ldd "$ROOT/bin/Ladybird" | grep 'not found'; then
            echo "::error::Faltan librerías en el paquete"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-arch-x86_64
          path: ladybird-arch-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
